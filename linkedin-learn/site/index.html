<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LinkedIn Learn — your saved articles, as a course</title>
  <meta name="description" content="Your LinkedIn saved articles, organised into an interactive learning platform with summaries, flashcards and quizzes." />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%238B5CF6'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='white' font-family='sans-serif'%3EL%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="app">
    <!-- Sidebar / primary navigation -->
    <aside class="sidebar" aria-label="Primary">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">in</span>
        <span class="brand-name">Learn</span>
      </div>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-nav="dashboard"><span class="nav-ico" aria-hidden="true">◎</span><span>Dashboard</span></a>
        <a href="#/library" data-nav="library"><span class="nav-ico" aria-hidden="true">▤</span><span>Library</span></a>
        <a href="#/paths" data-nav="paths"><span class="nav-ico" aria-hidden="true">⛰</span><span>Paths</span></a>
        <a href="#/flashcards" data-nav="flashcards"><span class="nav-ico" aria-hidden="true">⚃</span><span>Flashcards</span></a>
        <a href="#/about" data-nav="about"><span class="nav-ico" aria-hidden="true">ⓘ</span><span>About</span></a>
      </nav>
      <div class="sidebar-foot">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch colour theme">
          <span class="theme-ico" aria-hidden="true">☾</span><span class="theme-label">Theme</span>
        </button>
        <button id="resetProgress" class="link-btn" type="button">Reset progress</button>
      </div>
    </aside>

    <!-- Top bar (mobile + search) -->
    <header class="topbar">
      <button id="menuBtn" class="icon-btn only-mobile" type="button" aria-label="Open menu" aria-expanded="false">☰</button>
      <div class="search">
        <span class="search-ico" aria-hidden="true">⌕</span>
        <input id="globalSearch" type="search" placeholder="Search articles, topics, authors…" aria-label="Search the library" autocomplete="off" />
      </div>
      <div class="topbar-right">
        <span id="sourceBadge" class="badge" title="Where this library came from">starter</span>
      </div>
    </header>

    <!-- Main view -->
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div id="routeStatus" class="sr-only" role="status" aria-live="polite"></div>

  <div id="scrim" class="scrim" hidden></div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="data/library.js"></script>
  <script src="js/store.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
